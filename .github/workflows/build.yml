name: build-site
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 * * * *"   # hourly; off the :00/:30 marks
  workflow_dispatch:
  repository_dispatch:
    types: [netpaw-release]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static site
        run: |
          pip install -r requirements.txt
          python3 build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }},ghcr.io/${{ github.repository }}:latest

      - name: Upload static artifact (for Dokploy/other hosts)
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          if-no-files-found: error

      - name: Tell netpaw-site-deploy (repository_dispatch; needs the RELEASE_DISPATCH_TOKEN secret, else its hourly redeploy picks the image up)
        if: github.event_name != 'pull_request' && env.DISPATCH != ''
        env:
          DISPATCH: ${{ secrets.RELEASE_DISPATCH_TOKEN || secrets.SITE_DISPATCH_TOKEN }}
          VER: ${{ github.event.client_payload.version }}
        run: |
          # Runs after the image is pushed, so the redeploy pulls the new site (a dispatch straight from the NetPaw
          # release job would redeploy before this build finished).
          body=$(python3 -c 'import json,sys; print(json.dumps({"event_type":"netpaw-release","client_payload":{"version":sys.argv[1]}}))' "$VER")
          curl -sS --fail -X POST https://api.github.com/repos/smol-kitten/netpaw-site-deploy/dispatches \
            -H @<(printf 'Authorization: Bearer %s\n' "$DISPATCH") -H 'Accept: application/vnd.github+json' -d "$body"
          echo "dispatched netpaw-release ${VER:-(site change)} to smol-kitten/netpaw-site-deploy"
