server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Strict security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; img-src 'self' data:; media-src 'none'; object-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; frame-src 'none'; manifest-src 'self'" always;

    # Gzip static text
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml text/plain;

    # Clean URLs -> /download/ and /docs/
    location /install.ps1 {
        add_header Content-Type "text/plain; charset=utf-8" always;
        try_files $uri =404;
    }
    location /download { try_files $uri $uri/ =404; }
    location /docs { try_files $uri $uri/ =404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Never cache the landing/install, cache assets briefly
    location ~* \.(css|js|png|svg)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}